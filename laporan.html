<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Data - ESP-12F</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div class="bg-primary text-white shadow" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-5 fw-bold border-bottom">
                <i class="fas fa-bolt me-2"></i>IoT Siliwangi
            </div>
            <div class="list-group list-group-flush mt-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent text-white border-0">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="laporan.html" class="list-group-item list-group-item-action bg-transparent text-white active border-0">
                    <i class="fas fa-file-alt me-2"></i>Laporan Data
                </a>
                <a href="#" class="list-group-item list-group-item-action bg-transparent text-danger mt-5 border-0 fw-bold" data-bs-toggle="modal" data-bs-target="#logoutModal">
                    <i class="fas fa-power-off me-2"></i>Log Out
                </a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm d-flex justify-content-between align-items-center">
                <h5 class="fw-bold m-0 text-dark text-uppercase" style="letter-spacing: 0.5px;">Laporan Monitoring Sensor</h5>
                <button class="btn btn-primary fw-bold px-4 shadow-sm" onclick="window.print()">
                    <i class="fas fa-print me-2"></i> CETAK LAPORAN
                </button>
            </nav>

            <div class="container-fluid p-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0 text-center align-middle">
                            <thead class="table-primary">
                                <tr>
                                    <th class="py-3">No</th>
                                    <th class="py-3">Waktu Terdata</th>
                                    <th class="py-3">Suhu DHT (°C)</th>
                                    <th class="py-3">Kadar MQ6 (PPM)</th>
                                    <th class="py-3">Keterangan</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="py-3">1</td>
                                    <td>2026-05-24 10:00</td>
                                    <td>26</td>
                                    <td>150</td>
                                    <td><span class="badge bg-success px-3 py-2">Normal</span></td>
                                </tr>
                                <tr>
                                    <td class="py-3">2</td>
                                    <td>2026-05-24 10:05</td>
                                    <td>27</td>
                                    <td>420</td>
                                    <td><span class="badge bg-danger px-3 py-2">Waspada</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered border-0">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-body text-center p-5">
                    <i class="fas fa-sign-out-alt fa-4x text-danger mb-3"></i>
                    <h5 class="fw-bold">Ingin Logout?</h5>
                    <p class="text-muted small">Anda harus login kembali untuk memantau data.</p>
                    <div class="mt-4 d-flex justify-content-center gap-2">
                        <button class="btn btn-light fw-bold px-4" data-bs-dismiss="modal">Batal</button>
                        <a href="index.html" class="btn btn-danger fw-bold px-4 shadow-sm">Keluar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
